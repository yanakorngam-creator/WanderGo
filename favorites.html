<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>สถานที่โปรด - WanderGo</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <div class="nav-container">

        <a
            href="dashboard.html"
            class="logo"
        >
            🌍 WanderGo
        </a>


        <nav class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="trip-planner.html">
                วางแผนทริป
            </a>

            <a href="budget.html">
                งบประมาณ
            </a>

            <a href="history.html">
                ประวัติทริป
            </a>

            <a
                href="favorites.html"
                class="active"
            >
                ❤️ สถานที่โปรด
            </a>

            <a href="profile.html">
                โปรไฟล์
            </a>

        </nav>

    </div>

</header>



<!-- =========================================
     MAIN CONTENT
========================================= -->

<main class="container">


    <!-- หัวข้อ -->

    <section class="welcome-section">

        <h1>
            ❤️ สถานที่โปรด
        </h1>

        <p>
            สถานที่ที่คุณบันทึกไว้สำหรับการเดินทาง
        </p>

    </section>



    <!-- =====================================
         FAVORITES
    ====================================== -->

    <section class="section">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                margin-bottom:20px;
                flex-wrap:wrap;
            "
        >

            <h2 style="margin:0;">
                📍 รายการสถานที่โปรด
            </h2>


            <div
                id="favoriteTotal"
                style="
                    color:#666;
                    font-size:14px;
                "
            >
                0 สถานที่
            </div>

        </div>



        <!-- ตรงนี้ JavaScript จะเอาสถานที่มาใส่ -->

        <div id="favoriteList">

        </div>


    </section>



    <!-- =====================================
         BUTTONS
    ====================================== -->

    <section
        style="
            display:flex;
            justify-content:center;
            gap:12px;
            flex-wrap:wrap;
            margin:30px 0 50px;
        "
    >

        <a
            href="dashboard.html"
            style="
                display:inline-block;
                padding:12px 20px;
                background:#2196f3;
                color:#ffffff;
                text-decoration:none;
                border-radius:10px;
                font-weight:600;
            "
        >
            ← กลับ Dashboard
        </a>


        <a
            href="history.html"
            style="
                display:inline-block;
                padding:12px 20px;
                background:#ffffff;
                color:#2196f3;
                text-decoration:none;
                border:1px solid #2196f3;
                border-radius:10px;
                font-weight:600;
            "
        >
            📚 ดูประวัติทริป
        </a>

    </section>


</main>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="js/script.js"></script>


<script>


/* =========================================
   ตรวจสอบ Login
========================================= */

if (!requireLogin()) {

    throw new Error(
        "User is not logged in."
    );

}



/* =========================================
   แสดงสถานที่โปรด
========================================= */

function renderFavorites() {


    const favoriteList =
        document.getElementById(
            "favoriteList"
        );


    const favoriteTotal =
        document.getElementById(
            "favoriteTotal"
        );


    const favorites =
        getFavorites();



    /* จำนวนสถานที่ */

    favoriteTotal.textContent =
        favorites.length +
        " สถานที่";



    /* =====================================
       ถ้าไม่มีสถานที่โปรด
    ====================================== */

    if (favorites.length === 0) {


        favoriteList.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:50px 20px;
                    background:#f8fafc;
                    border-radius:18px;
                    border:1px solid #eeeeee;
                "
            >

                <div
                    style="
                        font-size:60px;
                        margin-bottom:15px;
                    "
                >
                    💔
                </div>


                <h2
                    style="
                        margin:0 0 10px;
                    "
                >
                    ยังไม่มีสถานที่โปรด
                </h2>


                <p
                    style="
                        color:#666;
                        margin-bottom:25px;
                    "
                >
                    ไปเลือกสถานที่ที่คุณชอบ
                    แล้วกด ❤️ เพื่อบันทึกไว้ที่นี่
                </p>


                <a
                    href="history.html"
                    style="
                        display:inline-block;
                        padding:12px 22px;
                        background:#2196f3;
                        color:#ffffff;
                        text-decoration:none;
                        border-radius:10px;
                        font-weight:600;
                    "
                >
                    📚 ไปดูประวัติทริป
                </a>

            </div>

        `;


        return;

    }



    /* =====================================
       แสดงรายการสถานที่
    ====================================== */

    favoriteList.innerHTML = favorites
        .map(function(place) {


            const image =
                place.image || "";



            return `

                <div
                    style="
                        background:#ffffff;
                        border-radius:18px;
                        padding:20px;
                        margin-bottom:16px;
                        box-shadow:0 4px 18px rgba(0,0,0,0.07);
                        border:1px solid #eeeeee;
                    "
                >

                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            gap:20px;
                            flex-wrap:wrap;
                        "
                    >


                        <!-- ข้อมูลสถานที่ -->

                        <div
                            style="
                                display:flex;
                                align-items:center;
                                gap:15px;
                            "
                        >


                            <!-- รูป -->

                            <div
                                style="
                                    width:70px;
                                    height:70px;
                                    border-radius:14px;
                                    overflow:hidden;
                                    background:#f1f5f9;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    flex-shrink:0;
                                "
                            >

                                ${
                                    image
                                    ?
                                    `
                                        <img
                                            src="${escapeHTML(image)}"
                                            alt="${escapeHTML(place.name)}"
                                            style="
                                                width:100%;
                                                height:100%;
                                                object-fit:cover;
                                            "
                                        >
                                    `
                                    :
                                    `
                                        <span
                                            style="
                                                font-size:30px;
                                            "
                                        >
                                            📍
                                        </span>
                                    `
                                }

                            </div>



                            <!-- ชื่อ -->

                            <div>

                                <h3
                                    style="
                                        margin:0 0 6px;
                                    "
                                >
                                    ${escapeHTML(
                                        place.name ||
                                        "สถานที่ไม่มีชื่อ"
                                    )}
                                </h3>


                                <p
                                    style="
                                        margin:0;
                                        color:#777;
                                        font-size:14px;
                                    "
                                >
                                    ❤️ สถานที่โปรด
                                </p>

                            </div>


                        </div>



                        <!-- ปุ่มลบ -->

                        <button
                            type="button"
                            onclick="removeFavorite('${escapeHTML(place.id)}')"
                            style="
                                border:none;
                                background:#fff1f2;
                                color:#e11d48;
                                padding:10px 15px;
                                border-radius:10px;
                                cursor:pointer;
                                font-weight:600;
                            "
                        >
                            🗑️ ลบออก
                        </button>


                    </div>


                </div>

            `;

        })
        .join("");

}



/* =========================================
   ลบสถานที่โปรด
========================================= */

function removeFavorite(placeId) {


    const favorites =
        getFavorites();


    const newFavorites =
        favorites.filter(function(place) {

            return String(place.id) !==
                String(placeId);

        });


    saveFavorites(newFavorites);


    showToast(
        "ลบสถานที่ออกจากรายการโปรดแล้ว ❤️"
    );


    renderFavorites();

}



/* =========================================
   เริ่มต้นหน้า
========================================= */

renderFavorites();


</script>


</body>

</html>
