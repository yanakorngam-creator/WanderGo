<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WanderGo - โปรไฟล์</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="page">


    <!-- =====================================
         Navigation
         ===================================== -->

    <header class="navbar">

        <div class="nav-container">

            <a
                href="dashboard.html"
                class="logo"
            >

                <span>
                    ✈️
                </span>

                <span>
                    WanderGo
                </span>

            </a>


            <nav class="nav-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="trip-planner.html">
                    วางแผนทริป
                </a>

                <a href="budget.html">
                    งบประมาณ
                </a>

                <a href="history.html">
                    ประวัติ
                </a>

                <a href="favorites.html">
                    ❤️ สถานที่โปรด
                </a>

                <a
                    href="profile.html"
                    class="active"
                >
                    โปรไฟล์
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================
         Main
         ===================================== -->

    <main class="main">

        <div class="container">

            <div class="page-title">

                <h1>
                    👤 โปรไฟล์ของฉัน
                </h1>

                <p>
                    จัดการข้อมูลส่วนตัวของคุณ
                </p>

            </div>


            <!-- =================================
                 Profile Card
                 ================================= -->

            <section class="card profile-card">


                <!-- Avatar -->

                <div class="profile-header">

                    <div class="profile-avatar">
                        👤
                    </div>

                    <h2 id="profileName">
                        ผู้ใช้งาน
                    </h2>

                    <p id="profileEmail">
                        -
                    </p>

                </div>


                <!-- =================================
                     Alert
                     ================================= -->

                <div
                    id="profileAlert"
                    class="alert alert-success"
                    style="display:none;"
                ></div>


                <!-- =================================
                     Form
                     ================================= -->

                <form id="profileForm">


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            ชื่อ
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="กรอกชื่อของคุณ"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            อีเมล
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>


                    <!-- Bio -->

                    <div class="form-group">

                        <label for="bio">
                            เกี่ยวกับฉัน
                        </label>

                        <textarea
                            id="bio"
                            name="bio"
                            placeholder="เล่าเกี่ยวกับตัวคุณสักเล็กน้อย..."
                        ></textarea>

                    </div>


                    <!-- Buttons -->

                    <div class="trip-actions">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            💾 บันทึกข้อมูล
                        </button>


                        <button
                            type="button"
                            class="btn btn-danger"
                            id="logoutButton"
                        >
                            🚪 ออกจากระบบ
                        </button>

                    </div>


                </form>

            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
         ===================================== -->

    <footer class="footer">

        WanderGo © 2026

    </footer>


</div>


<!-- =====================================
     Main JavaScript
     ===================================== -->

<script src="js/script.js"></script>


<script>

    /* =====================================
       Login Check
       ===================================== */

    if (!requireLogin()) {

        throw new Error(
            "User is not logged in"
        );

    }


    /* =====================================
       Elements
       ===================================== */

    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const bioInput =
        document.getElementById("bio");

    const profileName =
        document.getElementById("profileName");

    const profileEmail =
        document.getElementById("profileEmail");

    const profileForm =
        document.getElementById("profileForm");

    const profileAlert =
        document.getElementById("profileAlert");

    const logoutButton =
        document.getElementById("logoutButton");


    /* =====================================
       Load User
       ===================================== */

    function loadProfile() {

        const user =
            getCurrentUser();


        if (!user) {

            return;

        }


        nameInput.value =
            user.name || "";


        emailInput.value =
            user.email || "";


        bioInput.value =
            user.bio || "";


        profileName.textContent =
            user.name || "ผู้ใช้งาน";


        profileEmail.textContent =
            user.email || "-";

    }


    /* =====================================
       Show Alert
       ===================================== */

    function showProfileAlert(
        message
    ) {

        profileAlert.textContent =
            message;

        profileAlert.style.display =
            "block";


        setTimeout(
            function() {

                profileAlert.style.display =
                    "none";

            },
            2500
        );

    }


    /* =====================================
       Save Profile
       ===================================== */

    profileForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const currentUser =
                getCurrentUser();


            if (!currentUser) {

                return;

            }


            const updatedUser = {

                ...currentUser,

                name:
                    nameInput.value.trim(),

                email:
                    emailInput.value.trim(),

                bio:
                    bioInput.value.trim()

            };


            saveCurrentUser(
                updatedUser
            );


            profileName.textContent =
                updatedUser.name ||
                "ผู้ใช้งาน";


            profileEmail.textContent =
                updatedUser.email ||
                "-";


            showProfileAlert(
                "บันทึกข้อมูลเรียบร้อยแล้ว ✓"
            );

        }
    );


    /* =====================================
       Logout
       ===================================== */

    logoutButton.addEventListener(
        "click",
        function() {

            const confirmed =
                confirm(
                    "ต้องการออกจากระบบหรือไม่?"
                );


            if (!confirmed) {

                return;

            }


            logout();

        }
    );


    /* =====================================
       Start
       ===================================== */

    loadProfile();

</script>

</body>

</html>
