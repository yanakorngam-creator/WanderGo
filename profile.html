<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WanderGo - โปรไฟล์</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="page">


    <!-- =====================================
         Header
         ===================================== -->

    <header class="header">

        <div class="container header-inner">

            <a
                href="dashboard.html"
                class="logo"
            >

                <span class="logo-icon">
                    ✈️
                </span>

                <span>
                    WanderGo
                </span>

            </a>


            <nav class="nav">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="trip-planner.html">
                    วางแผนทริป
                </a>

                <a href="budget.html">
                    งบประมาณ
                </a>

                <a href="history.html">
                    ประวัติ
                </a>

                <a
                    href="profile.html"
                    class="active"
                >
                    โปรไฟล์
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================
         Main
         ===================================== -->

    <main class="main">

        <div class="container">


            <!-- Page Title -->

            <div class="page-title">

                <h1>
                    👤 โปรไฟล์ของฉัน
                </h1>

                <p>
                    จัดการข้อมูลส่วนตัวของคุณ
                </p>

            </div>


            <!-- =================================
                 Profile Card
                 ================================= -->

            <section class="card profile-card">


                <!-- =================================
                     Normal Profile View
                     ================================= -->

                <div id="profileView">


                    <div class="profile-header">

                        <div class="profile-avatar">
                            👤
                        </div>

                        <h2 id="profileName">
                            ผู้ใช้งาน
                        </h2>

                        <p id="profileEmail">
                            -
                        </p>

                    </div>


                    <!-- About Me -->

                    <div
                        id="profileBioBox"
                        style="
                            margin-top: 20px;
                            text-align: center;
                        "
                    >

                        <p
                            style="
                                margin-bottom: 6px;
                                font-weight: 600;
                            "
                        >
                            📝 เกี่ยวกับฉัน
                        </p>

                        <p
                            id="profileBio"
                            style="
                                color: #718592;
                                margin: 0;
                            "
                        >
                            ยังไม่มีข้อมูล
                        </p>

                    </div>


                    <!-- Edit Button -->

                    <div
                        style="
                            margin-top: 25px;
                            text-align: center;
                        "
                    >

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="editProfileButton"
                        >
                            ✏️ แก้ไขโปรไฟล์
                        </button>

                    </div>

                </div>


                <!-- =================================
                     Edit Profile Section
                     ================================= -->

                <div
                    id="editSection"
                    style="display: none;"
                >

                    <div class="profile-header">

                        <div class="profile-avatar">
                            👤
                        </div>

                        <h2>
                            ✏️ แก้ไขโปรไฟล์
                        </h2>

                        <p>
                            แก้ไขข้อมูลส่วนตัวของคุณ
                        </p>

                    </div>


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            👤 ชื่อผู้ใช้งาน
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="กรอกชื่อผู้ใช้งาน"
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            📧 อีเมล
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="กรอกอีเมล"
                        >

                    </div>


                    <!-- Bio -->

                    <div class="form-group">

                        <label for="bio">
                            📝 เกี่ยวกับฉัน
                        </label>

                        <textarea
                            id="bio"
                            placeholder="เขียนข้อมูลเกี่ยวกับตัวคุณ..."
                        ></textarea>

                    </div>


                    <!-- Buttons -->

                    <div
                        style="
                            display: flex;
                            gap: 12px;
                            margin-top: 20px;
                        "
                    >

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="saveProfileButton"
                            style="flex: 1;"
                        >
                            💾 บันทึกการแก้ไข
                        </button>


                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelEditButton"
                            style="flex: 1;"
                        >
                            ยกเลิก
                        </button>

                    </div>

                </div>


                <!-- =================================
                     Logout
                     ================================= -->

                <div
                    style="
                        margin-top: 25px;
                        text-align: center;
                    "
                >

                    <button
                        type="button"
                        class="btn btn-danger"
                        id="logoutButton"
                    >
                        🚪 ออกจากระบบ
                    </button>

                </div>


            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
         ===================================== -->

    <footer class="footer">

        WanderGo © 2026

    </footer>


</div>


<!-- =====================================
     JavaScript
     ===================================== -->

<script src="js/script.js"></script>


<script>

    /* =====================================
       Login Check
       ===================================== */

    if (!requireLogin()) {

        throw new Error(
            "User is not logged in"
        );

    }


    /* =====================================
       Get Elements
       ===================================== */

    const profileView =
        document.getElementById(
            "profileView"
        );


    const editSection =
        document.getElementById(
            "editSection"
        );


    const editProfileButton =
        document.getElementById(
            "editProfileButton"
        );


    const cancelEditButton =
        document.getElementById(
            "cancelEditButton"
        );


    const nameInput =
        document.getElementById(
            "name"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const bioInput =
        document.getElementById(
            "bio"
        );


    const profileName =
        document.getElementById(
            "profileName"
        );


    const profileEmail =
        document.getElementById(
            "profileEmail"
        );


    const profileBio =
        document.getElementById(
            "profileBio"
        );


    const saveButton =
        document.getElementById(
            "saveProfileButton"
        );


    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    /* =====================================
       Load Profile
       ===================================== */

    function loadProfile() {

        const user =
            getCurrentUser();


        if (!user) {

            return;

        }


        nameInput.value =
            user.name || "";


        emailInput.value =
            user.email || "";


        bioInput.value =
            user.bio || "";


        profileName.textContent =
            user.name ||
            "ผู้ใช้งาน";


        profileEmail.textContent =
            user.email ||
            "-";


        profileBio.textContent =
            user.bio ||
            "ยังไม่มีข้อมูล";

    }


    /* =====================================
       Open Edit Mode
       ===================================== */

    editProfileButton.addEventListener(
        "click",
        function() {

            const user =
                getCurrentUser();


            if (!user) {

                return;

            }


            nameInput.value =
                user.name || "";


            emailInput.value =
                user.email || "";


            bioInput.value =
                user.bio || "";


            profileView.style.display =
                "none";


            editSection.style.display =
                "block";

        }
    );


    /* =====================================
       Cancel Edit
       ===================================== */

    cancelEditButton.addEventListener(
        "click",
        function() {

            editSection.style.display =
                "none";


            profileView.style.display =
                "block";


            loadProfile();

        }
    );


    /* =====================================
       Save Profile
       ===================================== */

    saveButton.addEventListener(
        "click",
        function() {

            const user =
                getCurrentUser();


            if (!user) {

                return;

            }


            const name =
                nameInput.value.trim();


            const email =
                emailInput.value.trim();


            const bio =
                bioInput.value.trim();


            /* Validate name */

            if (!name) {

                alert(
                    "กรุณากรอกชื่อผู้ใช้งาน"
                );

                nameInput.focus();

                return;

            }


            /* Validate email */

            if (!email) {

                alert(
                    "กรุณากรอกอีเมล"
                );

                emailInput.focus();

                return;

            }


            /* Updated user */

            const updatedUser = {

                ...user,

                name: name,

                email: email,

                bio: bio

            };


            /* Save */

            saveCurrentUser(
                updatedUser
            );


            /* Update profile */

            profileName.textContent =
                name;


            profileEmail.textContent =
                email;


            profileBio.textContent =
                bio ||
                "ยังไม่มีข้อมูล";


            /* Back to profile */

            editSection.style.display =
                "none";


            profileView.style.display =
                "block";


            /* Success */

            alert(
                "บันทึกข้อมูลเรียบร้อยแล้ว ✓"
            );

        }
    );


    /* =====================================
       Logout
       ===================================== */

    logoutButton.addEventListener(
        "click",
        function() {

            const confirmed =
                confirm(
                    "ต้องการออกจากระบบหรือไม่?"
                );


            if (!confirmed) {

                return;

            }


            logout();

        }
    );


    /* =====================================
       Start
       ===================================== */

    loadProfile();

</script>

</body>

</html>
