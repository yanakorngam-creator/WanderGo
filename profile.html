<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WanderGo - โปรไฟล์</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="page">


    <!-- =====================================
         Header
         ===================================== -->

    <header class="header">

        <div class="container header-inner">

            <a
                href="dashboard.html"
                class="logo"
            >

                <span class="logo-icon">
                    ✈️
                </span>

                <span>
                    WanderGo
                </span>

            </a>


            <nav class="nav">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="trip-planner.html">
                    วางแผนทริป
                </a>

                <a href="budget.html">
                    งบประมาณ
                </a>

                <a href="history.html">
                    ประวัติ
                </a>

                <a href="favorites.html">
                    ❤️ สถานที่โปรด
                </a>

                <a
                    href="profile.html"
                    class="active"
                >
                    โปรไฟล์
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================
         Main
         ===================================== -->

    <main class="main">

        <div class="container">


            <div class="page-title">

                <h1>
                    👤 โปรไฟล์ของฉัน
                </h1>

                <p>
                    จัดการข้อมูลส่วนตัวของคุณ
                </p>

            </div>


            <!-- =================================
                 Profile Card
                 ================================= -->

            <section class="card profile-card">


                <div class="profile-header">

                    <div class="profile-avatar">
                        👤
                    </div>

                    <h2 id="profileName">
                        ผู้ใช้งาน
                    </h2>

                    <p id="profileEmail">
                        -
                    </p>

                </div>


                <!-- =================================
                     Edit Form
                     ================================= -->

                <div
                    id="editSection"
                    style="display: block;"
                >

                    <div class="form-group">

                        <label for="name">
                            👤 ชื่อผู้ใช้งาน
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="กรอกชื่อผู้ใช้งาน"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            📧 อีเมล
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="กรอกอีเมล"
                        >

                    </div>


                    <div class="form-group">

                        <label for="bio">
                            📝 เกี่ยวกับฉัน
                        </label>

                        <textarea
                            id="bio"
                            placeholder="เขียนข้อมูลเกี่ยวกับตัวคุณ..."
                        ></textarea>

                    </div>


                    <button
                        type="button"
                        class="btn btn-primary btn-full"
                        id="saveProfileButton"
                    >
                        💾 บันทึกการแก้ไข
                    </button>

                </div>


                <!-- =================================
                     Logout
                     ================================= -->

                <div
                    style="
                        margin-top: 20px;
                        text-align: center;
                    "
                >

                    <button
                        type="button"
                        class="btn btn-danger"
                        id="logoutButton"
                    >
                        🚪 ออกจากระบบ
                    </button>

                </div>


            </section>

        </div>

    </main>


    <!-- =====================================
         Footer
         ===================================== -->

    <footer class="footer">

        WanderGo © 2026

    </footer>


</div>


<!-- =====================================
     JavaScript
     ===================================== -->

<script src="js/script.js"></script>


<script>

    /* =====================================
       Login Check
       ===================================== */

    if (!requireLogin()) {

        throw new Error(
            "User is not logged in"
        );

    }


    /* =====================================
       Get Elements
       ===================================== */

    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const bioInput =
        document.getElementById("bio");

    const profileName =
        document.getElementById("profileName");

    const profileEmail =
        document.getElementById("profileEmail");

    const saveButton =
        document.getElementById(
            "saveProfileButton"
        );

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    /* =====================================
       Load Profile
       ===================================== */

    function loadProfile() {

        const user =
            getCurrentUser();


        if (!user) {

            return;

        }


        nameInput.value =
            user.name || "";


        emailInput.value =
            user.email || "";


        bioInput.value =
            user.bio || "";


        profileName.textContent =
            user.name ||
            "ผู้ใช้งาน";


        profileEmail.textContent =
            user.email ||
            "-";

    }


    /* =====================================
       Save Profile
       ===================================== */

    saveButton.addEventListener(
        "click",
        function() {

            const user =
                getCurrentUser();


            if (!user) {

                return;

            }


            const name =
                nameInput.value.trim();


            const email =
                emailInput.value.trim();


            const bio =
                bioInput.value.trim();


            if (!name) {

                alert(
                    "กรุณากรอกชื่อผู้ใช้งาน"
                );

                return;

            }


            if (!email) {

                alert(
                    "กรุณากรอกอีเมล"
                );

                return;

            }


            const updatedUser = {

                ...user,

                name:
                    name,

                email:
                    email,

                bio:
                    bio

            };


            saveCurrentUser(
                updatedUser
            );


            profileName.textContent =
                name;


            profileEmail.textContent =
                email;


            alert(
                "บันทึกข้อมูลเรียบร้อยแล้ว ✓"
            );

        }
    );


    /* =====================================
       Logout
       ===================================== */

    logoutButton.addEventListener(
        "click",
        function() {

            const confirmed =
                confirm(
                    "ต้องการออกจากระบบหรือไม่?"
                );


            if (!confirmed) {

                return;

            }


            logout();

        }
    );


    /* =====================================
       Start
       ===================================== */

    loadProfile();

</script>

</body>

</html>
