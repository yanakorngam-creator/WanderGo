<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WanderGo - เข้าสู่ระบบ</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">✈️</div>

                <h1>WanderGo</h1>

                <p>
                    วางแผนการเดินทางของคุณ
                    ให้สนุกและง่ายขึ้น
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="name">
                        ชื่อ
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="กรอกชื่อของคุณ"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        อีเมล
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    เข้าสู่ WanderGo
                </button>

            </form>


            <p class="login-note">
                ตัวอย่างสำหรับโปรเจกต์ WanderGo
            </p>

        </section>

    </main>


    <!-- JavaScript หลักของระบบ -->
    <script src="js/script.js"></script>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    if (
                        name === "" ||
                        email === ""
                    ) {

                        alert(
                            "กรุณากรอกข้อมูลให้ครบ"
                        );

                        return;

                    }


                    /*
                     * ใช้ฟังก์ชัน loginUser()
                     * จาก js/script.js
                     *
                     * เพื่อให้ทุกหน้าของ WanderGo
                     * ใช้ข้อมูลผู้ใช้ชุดเดียวกัน
                     */

                    loginUser(
                        email,
                        name
                    );


                    /*
                     * เมื่อ Login สำเร็จ
                     * ไปหน้า Dashboard
                     */

                    window.location.href =
                        "dashboard.html";

                }
            );

    </script>

</body>
</html>
