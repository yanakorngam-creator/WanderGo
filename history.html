<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WanderGo - ประวัติการเดินทาง</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page">

    <!-- Header -->
    <header class="header">
        <div class="container header-inner">

            <a href="dashboard.html" class="logo">
                <span class="logo-icon">✈️</span>
                <span>WanderGo</span>
            </a>

            <!-- Navigation -->
            <nav class="nav">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="trip-planner.html">
                    วางแผนทริป
                </a>

                <a href="budget.html">
                    งบประมาณ
                </a>

                <a href="history.html" class="active">
                    ประวัติ
                </a>

                <a href="profile.html">
                    โปรไฟล์
                </a>

            </nav>

        </div>
    </header>


    <!-- Main -->
    <main class="main">

        <div class="container">

            <div class="page-title">

                <h1>📚 ประวัติการเดินทาง</h1>

                <p>
                    ทริปทั้งหมดที่คุณบันทึกไว้
                </p>

            </div>


            <!-- Trip List -->
            <section
                id="tripList"
                class="trip-list"
            ></section>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">
        WanderGo © 2026
    </footer>

</div>


<!-- Main JavaScript -->
<script src="js/script.js"></script>


<script>

    /*
     * ตรวจสอบว่าผู้ใช้ Login แล้วหรือยัง
     */
    if (!requireLogin()) {
        throw new Error("User is not logged in");
    }


    /*
     * แสดงรายการทริปทั้งหมด
     */
    function renderTrips() {

        const trips = getTrips();

        const container = document.getElementById("tripList");


        /*
         * ถ้ายังไม่มีทริป
         */
        if (trips.length === 0) {

            container.innerHTML = `

                <div class="card">

                    <div class="empty-state">

                        <div class="empty-icon">
                            🗺️
                        </div>

                        <h3>
                            ยังไม่มีประวัติการเดินทาง
                        </h3>

                        <p>
                            เริ่มสร้างทริปแรกของคุณได้เลย
                        </p>

                        <br>

                        <a
                            href="trip-planner.html"
                            class="btn btn-primary"
                        >
                            + สร้างทริปใหม่
                        </a>

                    </div>

                </div>

            `;

            return;
        }


        /*
         * แสดงทริป
         * เอาทริปล่าสุดขึ้นก่อน
         */
        container.innerHTML = trips
            .slice()
            .reverse()
            .map(function(trip) {

                const places = trip.places || [];

                const firstPlace =
                    places.length > 0
                        ? places[0]
                        : null;


                const image =
                    firstPlace && firstPlace.image
                        ? firstPlace.image
                        : "";


                /*
                 * รายชื่อสถานที่
                 */
                const placesHTML =
                    places.length > 0

                        ? places.map(function(place) {

                            return `

                                <span class="place-tag">
                                    📍 ${escapeHTML(place.name)}
                                </span>

                            `;

                        }).join("")

                        : `

                            <span class="place-tag">
                                ยังไม่ได้เพิ่มสถานที่
                            </span>

                        `;


                /*
                 * HTML ของแต่ละทริป
                 */
                return `

                    <article class="trip-card">


                        <!-- รูปภาพ -->
                        <div>

                            ${
                                image

                                ? `

                                    <img
                                        src="${escapeHTML(image)}"
                                        class="trip-image"
                                        alt="${escapeHTML(trip.tripName)}"
                                    >

                                `

                                : `

                                    <div
                                        class="trip-image"
                                        style="
                                            background:#eaf7ff;
                                            display:flex;
                                            align-items:center;
                                            justify-content:center;
                                            font-size:55px;
                                        "
                                    >
                                        🗺️
                                    </div>

                                `
                            }

                        </div>


                        <!-- รายละเอียดทริป -->
                        <div class="trip-content">


                            <h3>
                                ${escapeHTML(trip.tripName)}
                            </h3>


                            <p>

                                📍
                                ${escapeHTML(trip.destination)}

                                ${
                                    trip.province
                                        ? " · " +
                                          escapeHTML(trip.province)
                                        : ""
                                }

                            </p>


                            <!-- วันที่ -->
                            <div class="trip-meta">

                                <span class="place-tag">

                                    📅
                                    ${formatDate(trip.startDate)}

                                </span>


                                <span class="place-tag">

                                    ถึง
                                    ${formatDate(trip.endDate)}

                                </span>

                            </div>


                            <!-- สถานที่ -->
                            <div class="trip-meta">

                                ${placesHTML}

                            </div>


                            <!-- ค่าใช้จ่าย -->
                            <div class="trip-cost">

                                💰
                                ${formatMoney(
                                    calculateTripCost(trip)
                                )}

                            </div>


                            <!-- รายละเอียดเพิ่มเติม -->
                            ${
                                trip.details

                                    ? `

                                        <p
                                            style="
                                                margin-top:10px;
                                                color:#718592;
                                            "
                                        >
                                            ${escapeHTML(trip.details)}
                                        </p>

                                    `

                                    : ""
                            }


                            <!-- ปุ่ม -->
                            <div class="trip-actions">


                                <a
                                    href="budget.html?id=${encodeURIComponent(trip.id)}"
                                    class="btn btn-secondary"
                                >
                                    💰 ดูงบประมาณ
                                </a>


                                <button
                                    type="button"
                                    class="btn btn-danger"
                                    onclick="deleteTrip('${escapeHTML(trip.id)}')"
                                >
                                    🗑️ ลบทริป
                                </button>


                            </div>

                        </div>

                    </article>

                `;

            })
            .join("");
    }


    /*
     * ลบทริป
     */
    function deleteTrip(tripId) {

        const trip = getTripById(tripId);

        if (!trip) {
            return;
        }


        const confirmed = confirm(
            `ต้องการลบทริป "${trip.tripName}" หรือไม่?`
        );


        if (!confirmed) {
            return;
        }


        removeTrip(tripId);


        /*
         * แสดงรายการใหม่หลังลบ
         */
        renderTrips();


        /*
         * แจ้งเตือน
         */
        showToast("ลบทริปเรียบร้อยแล้ว");

    }


    /*
     * เริ่มแสดงข้อมูล
     */
    renderTrips();

</script>

</body>
</html>
